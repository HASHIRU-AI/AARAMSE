[project]
name = "aaramse-rewrite"
version = "0.1.0"
description = "Monotone pragmatic rewrite calculus for over-refusal repair (AARAMSE rewrite stage)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aaramse = "aaramse.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaramse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The project style guide mandates typing-module aliases (Dict, Optional, ...),
# so the pyupgrade "UP" family is deliberately not selected.
select = ["E", "F", "I", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
